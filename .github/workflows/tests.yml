name: Tests

on:
  push:
    branches: [main, 'docs/**', 'feat/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: python -m compileall -q jarvis tests scripts
      - name: Compile GUI launcher
        run: python -m py_compile Start_JARVIS.pyw
      - name: Parse PowerShell UI Automation helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts/jarvis_notepad_uia.ps1"
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell helper syntax OK"
      - name: Run standard-library test suite
        id: unit_tests
        run: python -m unittest discover -s tests -v
      - name: Write bounded test receipt
        if: always()
        env:
          JARVIS_TEST_RESULT: ${{ job.status }}
        run: python scripts/write_ci_test_receipt.py jarvis-ci-test-receipt.json
      - name: Upload test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-test-receipt-${{ matrix.os }}
          path: jarvis-ci-test-receipt.json
          if-no-files-found: warn
          retention-days: 14
