name: Tests

on:
  push:
    branches: [main, 'docs/**', 'feat/**']
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python sources
        run: python -m compileall -q jarvis tests scripts
      - name: Compile GUI launcher
        run: python -m py_compile Start_JARVIS.pyw
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
