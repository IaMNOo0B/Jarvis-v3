name: Manual Candidate Tests

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character commit SHA to test from this repository"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-candidate-tests-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  candidate-tests:
    if: github.ref == 'refs/heads/main'
    name: Candidate tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate candidate commit SHA
        env:
          JARVIS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          python -c "import os,re,sys; value=os.environ.get('JARVIS_CANDIDATE_SHA',''); sys.exit(0 if re.fullmatch(r'[0-9a-fA-F]{40}', value) else 1)"

      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Compile candidate Python sources
        working-directory: candidate
        run: python -m compileall -q jarvis tests scripts

      - name: Compile candidate GUI launcher
        working-directory: candidate
        run: python -m py_compile Start_JARVIS.pyw

      - name: Parse candidate PowerShell UI Automation helper
        if: runner.os == 'Windows'
        working-directory: candidate
        shell: powershell
        run: |
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "candidate/scripts/jarvis_notepad_uia.ps1"
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell helper syntax OK"

      - name: Run fixed candidate test suite
        id: candidate_tests
        working-directory: candidate
        run: python -m unittest discover -s tests -v

  candidate-receipts:
    if: always() && github.ref == 'refs/heads/main'
    name: Record candidate test receipts
    needs: [candidate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout trusted receipt tools from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read candidate outcomes from GitHub job metadata
        id: job_results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JARVIS_REPOSITORY: ${{ github.repository }}
          JARVIS_RUN_ID: ${{ github.run_id }}
        run: python scripts/read_candidate_job_results.py

      - name: Write Windows receipt
        if: always() && steps.job_results.outcome == 'success'
        env:
          JARVIS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          JARVIS_RECEIPT_RUNNER_OS: Windows
          JARVIS_TEST_RESULT: ${{ steps.job_results.outputs.windows_test_result }}
          JARVIS_JOB_RESULT: ${{ steps.job_results.outputs.windows_job_result }}
        run: python scripts/write_ci_test_receipt.py candidate-receipts/windows.json

      - name: Write Linux receipt
        if: always() && steps.job_results.outcome == 'success'
        env:
          JARVIS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          JARVIS_RECEIPT_RUNNER_OS: Linux
          JARVIS_TEST_RESULT: ${{ steps.job_results.outputs.linux_test_result }}
          JARVIS_JOB_RESULT: ${{ steps.job_results.outputs.linux_job_result }}
        run: python scripts/write_ci_test_receipt.py candidate-receipts/linux.json

      - name: Upload candidate test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-candidate-receipts
          path: candidate-receipts/*.json
          if-no-files-found: warn
          retention-days: 14
